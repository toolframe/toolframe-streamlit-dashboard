[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-streamlit-dashboard"
version = "0.5.1"
description = "Native Streamlit page and management provider for Toolframe"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "src/toolframe_streamlit_dashboard/templates/notes/LICENSE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.4.1", "streamlit==1.61.0", "uvicorn==0.42.0"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-streamlit-dashboard"
Repository = "https://github.com/toolframe/toolframe-streamlit-dashboard"
Documentation = "https://github.com/toolframe/toolframe-streamlit-dashboard#readme"
Issues = "https://github.com/toolframe/toolframe-streamlit-dashboard/issues"

[project.entry-points."toolframe.plugins"]
streamlit-dashboard = "toolframe_streamlit_dashboard.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "httpx>=0.28,<1", "hatchling>=1.27,<2"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[project.optional-dependencies]
authoring = ["tomlkit>=0.13,<1"]

[tool.hatch.build.targets.wheel.extra-metadata]
"authoring.json" = "toolframe-authoring.json"
