[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-streamlit-dashboard"
version = "0.4.0"
description = "Native Streamlit page and management provider for Toolframe"
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.2.0", "streamlit==1.61.0", "uvicorn==0.42.0"]

[project.entry-points."toolframe.plugins"]
streamlit-dashboard = "toolframe_streamlit_dashboard.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "httpx>=0.28,<1", "hatchling>=1.27,<2"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
