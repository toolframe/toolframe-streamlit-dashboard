name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-publish-${{ github.ref }}-pypi
  cancel-in-progress: false

jobs:
  release-ref:
    name: Require a matching version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Check tag against project.version
        shell: bash
        run: python scripts/check_release.py "$GITHUB_REF"

  validate:
    needs: release-ref
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  publish:
    name: Upload validated distributions
    needs: [validate, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/toolframe-streamlit-dashboard
    permissions:
      id-token: write
    steps:
      - name: Download distributions from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-distributions-ubuntu-24.04-${{ github.sha }}
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/
