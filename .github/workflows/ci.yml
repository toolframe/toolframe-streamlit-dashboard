name: Python CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# No shared concurrency group: this workflow is also called by publish.yml.
jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python 3.14.7)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: dashboard
          persist-credentials: false
      - name: Check out the pinned SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.repository_owner is the base repository owner for fork PRs.
          repository: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}/toolframe-sdk
          token: ${{ secrets.TOOLFRAME_READ_TOKEN || github.token }}
          ref: ef91b609137a5fe7bae8e0c893e74b096ff06ffe
          path: dependencies/toolframe-sdk
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.8'
          enable-cache: false
      - name: Validate in isolated environments
        shell: bash
        run: |
          python dashboard/scripts/validate.py \
            --sdk-source "$GITHUB_WORKSPACE/dependencies/toolframe-sdk" \
            --output-dir "$RUNNER_TEMP/dashboard-artifacts"
      - name: Save validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-distributions-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/dashboard-artifacts/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-validation-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dashboard-artifacts/pytest.xml
            ${{ runner.temp }}/dashboard-artifacts/validation.json
            ${{ runner.temp }}/dashboard-artifacts/installed.txt
            ${{ runner.temp }}/dashboard-artifacts/dependency-wheels/*.whl
          if-no-files-found: warn
          retention-days: 14
